# Local MongoDB as a single-node replica set (transactions require a replica set).
#   docker compose up -d
# Then use MONGO_URI=mongodb://127.0.0.1:27017/hotel?replicaSet=rs0&directConnection=true
services:
  mongo:
    image: mongo:7.0
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start; afterwards just reports status.
      test: >
        mongosh --quiet --port 27017 --eval
        "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

volumes:
  mongo-data:
